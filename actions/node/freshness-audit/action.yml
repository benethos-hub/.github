name: Known vulnerabilities of a package-lock.json
description: Audits every version a package-lock.json pins and writes the known vulnerabilities as findings for the freshness report.

# Runs npm audit from the package-lock.json in directory, the root by default.
# It reads the lockfile alone, so nothing is installed and no lifecycle script
# runs. npm comes with the runner, as in publish/mcpb. A vulnerability is a
# finding, not a failure. An audit endpoint that cannot be reached leaves the
# status inconclusive and no findings.jsonl. A lockfile that cannot be read fails
# the action. npm_audit.py holds the logic.
#
#   - uses: benethos-hub/.github/actions/node/freshness-audit@main
#     with:
#       findings: ${{ runner.temp }}/freshness/npm-audit
#       directory: assets/vendor
#       ignore-vulns: GHSA-xxxx-xxxx-xxxx

inputs:
  findings:
    description: The folder to write findings.jsonl and status.json into. It is created.
    required: true
  ignore-vulns:
    description: Vulnerability IDs to waive, separated by spaces.
    required: false
    default: ""
  directory:
    description: The folder with the package-lock.json, relative to the repository. A repository with several independent lockfiles runs the action once per folder.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # The cache belongs to the job. An action that saved it as well would
    # race the job for the same key. uv still uses the job's cache folder.
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false

    # npm audit exits non-zero when it finds something, so the exit code says
    # nothing and the script reads the JSON. NODE_ENV=production or omit=dev in
    # an .npmrc would hide the development packages, --include=dev keeps them.
    - name: Ask npm what is known against the lockfile
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        WORK: ${{ runner.temp }}/freshness-node-audit-work
      run: |
        set -uo pipefail
        if [ ! -s "$DIRECTORY/package-lock.json" ]; then
          echo "::error::Missing package-lock.json in $DIRECTORY, there is nothing to audit."
          exit 1
        fi
        mkdir -p "$WORK"
        cd "$DIRECTORY" || exit 1
        npm audit --json --package-lock-only --include=dev > "$WORK/audit.json" || true

    - name: Write the findings
      shell: bash
      env:
        LOCKFILE: ${{ inputs.directory }}/package-lock.json
        AUDIT: ${{ runner.temp }}/freshness-node-audit-work/audit.json
        IGNORE_VULNS: ${{ inputs.ignore-vulns }}
        FINDINGS: ${{ inputs.findings }}
      run: uv run --no-project --python ">=3.11" "$GITHUB_ACTION_PATH/npm_audit.py"
