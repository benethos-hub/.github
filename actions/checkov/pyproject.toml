# The Checkov this action runs, locked in uv.lock next to this file. The
# action runs in other repositories, and this folder comes along with it, so
# the lockfile decides there as well. Dependabot keeps it current.

[project]
name = "benethos-hub-checkov"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "checkov>=3.4.3",
]

[tool.uv]
package = false
