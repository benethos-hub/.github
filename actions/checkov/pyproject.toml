# The Checkov this action runs, locked in uv.lock next to this file. The
# action runs in other repositories, and this folder comes along with it, so
# the lockfile decides there as well. Dependabot keeps it current.

[project]
name = "benethos-hub-checkov"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "checkov>=3.4.3",
]

[tool.uv]
package = false
# checkov 3.4.3 pins asteval==1.0.6, which has two sandbox escapes
# (GHSA-89v8-rhwq-hf77, GHSA-9w56-46f6-3qhx), fixed in 1.0.9. Remove this once
# a checkov release allows 1.0.9 itself.
override-dependencies = ["asteval>=1.0.9"]
