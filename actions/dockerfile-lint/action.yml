name: Dockerfile lint
description: Lints every Dockerfile of the checkout with hadolint, with the findings in the step summary and in code scanning.

# hadolint reads the Dockerfiles that match the patterns and judges their
# form: an image without a tag or with latest, a package without a version,
# apt-get without cleaning up, ADD where COPY would do, no USER, and the
# shell lines of every RUN through ShellCheck. The findings go to the step
# summary and to code scanning under one category, through sarif-report,
# which fails the step from failure-level on, after the upload. A job of a
# repository's CI:
#
#   dockerfile-lint:
#     runs-on: ubuntu-latest
#     permissions:
#       contents: read
#       security-events: write
#     steps:
#       - uses: actions/checkout@<sha> # vX
#       - uses: benethos-hub/.github/actions/dockerfile-lint@main
#         with:
#           files: containers/**/Dockerfile
#           trusted-registries: docker.io ghcr.io
#
# The job checks out the repository first and grants security-events: write.
# hadolint is downloaded pinned by version and checksum, the one place for
# all repositories. Dependabot cannot see a download, so the Download pins
# report (.github/download-pins.yml) opens an issue once a newer release is
# out. Most repositories call this through the reusable workflow
# dockerfile-lint.yml, which adds the job around it. The levels in code
# scanning are hadolint's: error and warning as they are, info and style as
# note.

inputs:
  files:
    description: Glob patterns of the files to lint, separated by spaces, relative to the checkout.
    required: false
    default: "**/Dockerfile*"
  ignore:
    description: Rule codes not to report, separated by spaces, such as DL3025 DL3066. Say why in the call.
    required: false
    default: ""
  trusted-registries:
    description: Registries FROM may pull from, separated by spaces, such as docker.io ghcr.io. Empty trusts every registry.
    required: false
    default: ""
  config:
    description: The path of a .hadolint.yaml in the repository. Its ignore list and trusted registries come on top of the inputs.
    required: false
    default: ""
  failure-level:
    description: The level from which a finding fails the step, after the upload. none, note, warning or error. none, the default, fails nothing, the code scanning check of the repository decides. A repository that wants this job red sets a level.
    required: false
    default: none
  category:
    description: The name code scanning files the analysis under.
    required: false
    default: dockerfile-lint
  upload:
    description: Upload the findings to code scanning.
    required: false
    default: "true"
  artifact:
    description: The name of an artifact to keep the SARIF file in. Empty keeps none.
    required: false
    default: ""
  retention-days:
    description: How many days the artifact is kept.
    required: false
    default: "7"
  token:
    description: The token for the upload. The default is the token of the workflow, which needs security-events write.
    required: false
    default: ${{ github.token }}

outputs:
  sarif:
    description: The SARIF file hadolint left.
    value: ${{ runner.temp }}/dockerfile-lint/hadolint.sarif
  findings:
    description: How many findings there are.
    value: ${{ steps.report.outputs.findings }}
  highest:
    description: The highest level found, or none.
    value: ${{ steps.report.outputs.highest }}

runs:
  using: composite
  steps:
    # The cache belongs to the job. An action that saved it as well would
    # race the job for the same key.
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false

    # Pinned with its checksum. Dependabot cannot see a download, so the bump
    # is by hand, and the Download pins report opens an issue with both lines
    # to paste once a newer release is out.
    - name: Install hadolint
      shell: bash
      env:
        HADOLINT_VERSION: v2.15.1
        HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        HADOLINT_DIR: ${{ runner.temp }}/hadolint
      run: |
        set -euo pipefail
        mkdir -p "$HADOLINT_DIR"
        curl -fsSL -o "$HADOLINT_DIR/hadolint" \
          "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
        echo "${HADOLINT_SHA256}  $HADOLINT_DIR/hadolint" | sha256sum -c -
        chmod +x "$HADOLINT_DIR/hadolint"

    - name: Lint the Dockerfiles
      shell: bash
      env:
        HADOLINT: ${{ runner.temp }}/hadolint/hadolint
        FILES: ${{ inputs.files }}
        IGNORE: ${{ inputs.ignore }}
        TRUSTED_REGISTRIES: ${{ inputs.trusted-registries }}
        CONFIG: ${{ inputs.config }}
        OUT: ${{ runner.temp }}/dockerfile-lint/hadolint.sarif
      run: uv run --no-project --python ">=3.11" "$GITHUB_ACTION_PATH/dockerfile_lint.py"

    - name: Report
      id: report
      uses: benethos-hub/.github/actions/sarif-report@main
      with:
        sarif: ${{ runner.temp }}/dockerfile-lint/hadolint.sarif
        tool: hadolint
        category: ${{ inputs.category }}
        upload: ${{ inputs.upload }}
        artifact: ${{ inputs.artifact }}
        retention-days: ${{ inputs.retention-days }}
        failure-level: ${{ inputs.failure-level }}
        token: ${{ inputs.token }}
