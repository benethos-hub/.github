# The pip-audit this action runs, locked in uv.lock next to this file. The
# action runs in other repositories, and this folder comes along with it, so
# the lockfile decides there as well. Dependabot keeps it current.

[project]
name = "benethos-hub-pip-audit"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false
