name: pip-audit
description: Checks pinned Python packages for known vulnerabilities, against PyPI and OSV.

# The one place that decides how the organisation audits Python packages.
# python-dependency-audit passes the versions locked in uv.lock, and
# python-lowest-versions the versions it has just tested. Both get the same
# rules and the same waivers. The pip-audit version is locked in uv.lock next
# to this file.
#
#   - uses: benethos-hub/.github/actions/python/pip-audit@main
#     with:
#       requirements: ${{ runner.temp }}/versions.txt
#       ignore-vulns: GHSA-xxxx-xxxx-xxxx

inputs:
  requirements:
    description: File with one pinned package per line, as name==version. Markers after a semicolon are dropped, and a name may appear in several versions.
    required: true
  ignore-vulns:
    description: Vulnerability IDs to waive, separated by spaces. Meant for a vulnerability without a fixed version yet.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The cache belongs to the job. An action that saved it as well would
    # race the job for the same key. uv still uses the job's cache folder.
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: false

    - name: Audit against PyPI and OSV
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
        IGNORE_VULNS: ${{ inputs.ignore-vulns }}
      run: |
        set -euo pipefail
        if [ ! -s "$REQUIREMENTS" ]; then
          echo "::error::$REQUIREMENTS is missing or empty, there is nothing to audit."
          exit 1
        fi

        # A package from a Git repository or a URL has no version to look up.
        # It is named here instead of being left out without a word.
        grep -vE '^[[:space:]]*(#|$)' "$REQUIREMENTS" \
          | grep -vE '^[A-Za-z0-9._-]+==' \
          | while read -r line; do
              echo "::warning::Not audited, no pinned version: $line"
            done || true

        # A package pinned in two versions (one for older Pythons, say) would
        # be a duplicate requirement, so each further version of a name goes
        # into the next file.
        work=$(mktemp -d)
        sed -n 's/^\([A-Za-z0-9._-]*==[^ ;]*\).*/\1/p' "$REQUIREMENTS" \
          | sort -u \
          | awk -F'==' -v dir="$work" '{ n[tolower($1)]++; print > (dir "/part" n[tolower($1)] ".txt") }'
        if ! ls "$work"/part*.txt > /dev/null 2>&1; then
          echo "::error::$REQUIREMENTS names no pinned version."
          exit 1
        fi
        echo "$(cat "$work"/part*.txt | wc -l) pinned versions"

        ignore=()
        for id in $IGNORE_VULNS; do
          ignore+=(--ignore-vuln "$id")
        done

        # pip-audit comes from uv.lock next to this file. Its environment goes
        # into the runner's temporary folder, not into the action's folder.
        export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP:-$work}/pip-audit-env"
        audit=(uv run --quiet --frozen --project "$GITHUB_ACTION_PATH" pip-audit)

        # --no-deps with --disable-pip audits exactly the listed versions
        # instead of resolving them anew. --strict fails when a package cannot
        # be audited at all, so a gap never passes as "no vulnerabilities".
        failed=0
        for service in pypi osv; do
          for part in "$work"/part*.txt; do
            echo "::group::$service, $(basename "$part")"
            "${audit[@]}" --strict --no-deps --disable-pip \
              --desc on --vulnerability-service "$service" ${ignore[@]+"${ignore[@]}"} \
              -r "$part" || failed=1
            echo "::endgroup::"
          done
        done
        exit "$failed"
