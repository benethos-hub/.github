name: Publish to the MCP Registry
description: Publishes a server.json to the MCP Registry, with the checksum of the release's Claude Desktop bundle filled in.

# What every repository did on its own before: check the entry's version
# against the release tag, install mcp-publisher, fill in the bundle's
# checksum, log in with the workflow's OIDC token and publish, with retries
# and a fallback without the bundle. The job that uses it runs after every
# package of the entry is out, grants id-token: write and checks out the
# repository first:
#
#   mcp-registry:
#     if: github.event_name == 'release' && !github.event.release.prerelease
#     needs: [pypi-publish, ghcr-publish, mcpb-bundle]
#     permissions:
#       contents: read
#       id-token: write # the registry grants io.github.benethos-hub/* to this token
#     steps:
#       - uses: actions/checkout@<sha> # vX
#       - uses: benethos-hub/.github/actions/publish/mcp-registry@main

inputs:
  entry:
    description: Path of the server.json to publish.
    required: false
    default: .github/publish/mcp-registry/server.json
  tag:
    description: The release tag. Empty means the tag of the release that started the workflow.
    required: false
    default: ""
  attempts:
    description: How often the entry with the bundle is offered before the fallback without it.
    required: false
    default: "6"
  wait-seconds:
    description: Pause between two attempts.
    required: false
    default: "60"
  token:
    description: Token that may download the release's assets.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: The release tag is the entry's version
      uses: benethos-hub/.github/actions/release/tag-matches-version@main
      with:
        file: ${{ inputs.entry }}
        tag: ${{ inputs.tag }}

    # The cache belongs to the job. An action that saved it as well would
    # race the job for the same key. uv still uses the job's cache folder.
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false

    # Pinned with its checksum. Dependabot cannot see a download, so the bump
    # is by hand. The Download pins report (.github/download-pins.yml) opens
    # an issue with both lines to paste once a newer release is out. The
    # registry refuses a publisher that is too old with "invalid audience".
    # This is the one place for all repositories.
    - name: Install mcp-publisher
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: v1.8.1
        MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        PUBLISHER_DIR: ${{ runner.temp }}/mcp-publisher
      run: |
        set -euo pipefail
        mkdir -p "$PUBLISHER_DIR"
        curl -fsSL -o "$PUBLISHER_DIR/mcp-publisher.tar.gz" \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "${MCP_PUBLISHER_SHA256}  $PUBLISHER_DIR/mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf "$PUBLISHER_DIR/mcp-publisher.tar.gz" -C "$PUBLISHER_DIR" mcp-publisher

    # The bundle's hash exists only now. The entry holds a placeholder, and
    # the hash is taken from the very file the release carries.
    - name: Fill in the bundle's checksum
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
        TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        script="$GITHUB_ACTION_PATH/registry_entry.py"
        bundle=$(uv run --no-project --python ">=3.11" "$script" bundle-name "$ENTRY")
        if [ -z "$bundle" ]; then
          echo "The entry lists no Claude Desktop bundle, nothing to fill in."
          exit 0
        fi
        gh release download "$TAG" --pattern "$bundle" --dir "$RUNNER_TEMP" --clobber
        uv run --no-project --python ">=3.11" "$script" fill "$ENTRY" "$RUNNER_TEMP/$bundle" "$TAG"

    - name: Log in with the workflow's OIDC token
      shell: bash
      env:
        PUBLISHER: ${{ runner.temp }}/mcp-publisher/mcp-publisher
      run: '"$PUBLISHER" login github-oidc'

    # The registry reads the version of a package from its index, and PyPI's
    # JSON API can report a fresh upload as missing for minutes. A refusal is
    # retried for a while. The registry takes an entry whole or not at all, so
    # a refusal that outlasts the attempts falls back to the entry without the
    # bundle: the version is listed at least with its other packages, and the
    # job still fails, so the refusal is looked at.
    - name: Publish the entry
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
        ATTEMPTS: ${{ inputs.attempts }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        PUBLISHER: ${{ runner.temp }}/mcp-publisher/mcp-publisher
      run: |
        set -euo pipefail
        script="$GITHUB_ACTION_PATH/registry_entry.py"
        for attempt in $(seq 1 "$ATTEMPTS"); do
          if "$PUBLISHER" publish "$ENTRY"; then
            exit 0
          fi
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            echo "attempt ${attempt} refused, trying again in ${WAIT_SECONDS} s"
            sleep "$WAIT_SECONDS"
          fi
        done
        if [ -z "$(uv run --no-project --python ">=3.11" "$script" bundle-name "$ENTRY")" ]; then
          echo "::error::The registry refused the entry ${ATTEMPTS} times. The refusals above say why."
          exit 1
        fi
        echo "::warning::The registry refused the entry with the bundle, publishing it without"
        uv run --no-project --python ">=3.11" "$script" drop "$ENTRY"
        "$PUBLISHER" publish "$ENTRY"
        echo "::error::Listed without the bundle. The refusals above say why."
        exit 1
