name: Publish the image to ghcr.io
description: Builds a multi-arch container image, pushes it to ghcr.io with tags derived from the release, and reads the published index back.

# One image per call. A repository with several images calls it once per
# image, from a matrix in its own job. The job grants packages: write and
# checks out the repository first:
#
#   ghcr-publish:
#     if: github.event_name == 'release' || github.ref == 'refs/heads/main'
#     needs: ci-passed
#     permissions:
#       contents: read
#       packages: write # push to ghcr.io as the GITHUB_TOKEN identity
#     steps:
#       - uses: actions/checkout@<sha> # vX
#       - uses: benethos-hub/.github/actions/publish/ghcr@main
#         with:
#           image: benethos-example
#           dockerfile: containers/images/example/Dockerfile
#
# Tags: a release v1.2.3 gives 1.2.3 and 1.2, and latest unless it is a
# pre-release, which gets its exact version only. A manual run gives edge.
# The release tag is read as version-scheme says: pep440 for a Python
# project (v1.0.0rc1), semver for others (v1.0.0-rc.1). The action handles
# the events release and workflow_dispatch. A push of a tag (on: push: tags)
# is not supported, since the version check and latest go by the release
# event. The OCI labels and annotations go on
# the manifests and on the index, since the package page of a multi-arch
# image reads the index. The published index is then read back: every tag
# must be the same index, and it must carry the description, the source,
# the version and every platform built. The check is in check_index.py next
# to this file.

inputs:
  image:
    description: Name of the image under ghcr.io/<owner>/.
    required: true
  dockerfile:
    description: Path of the Dockerfile.
    required: true
  context:
    description: Build context.
    required: false
    default: .
  platforms:
    description: Platforms to build, separated by commas.
    required: false
    default: linux/amd64,linux/arm64
  description:
    description: Title and description of this image on its package page. Empty takes the repository's description.
    required: false
    default: ""
  version-scheme:
    description: How the release tag is read for the image tags, pep440 for a Python project or semver.
    required: false
    default: pep440
  version-file:
    description: The file whose version a release tag must match, a pyproject.toml or a JSON file.
    required: false
    default: pyproject.toml
  token:
    description: Token that may push to ghcr.io (packages write).
    required: false
    default: ${{ github.token }}

outputs:
  tags:
    description: The tags pushed, one per line.
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: The digest of the pushed index.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: The version scheme is one the image tags can follow
      shell: bash
      env:
        SCHEME: ${{ inputs.version-scheme }}
      run: |
        case "$SCHEME" in
          pep440 | semver) echo "Image tags follow $SCHEME." ;;
          *)
            echo "::error::version-scheme is '$SCHEME'. Use pep440 for a Python project or semver."
            exit 1
            ;;
        esac

    - name: The release tag is the version in ${{ inputs.version-file }}
      if: github.event_name == 'release'
      uses: benethos-hub/.github/actions/release/tag-matches-version@main
      with:
        file: ${{ inputs.version-file }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    # Emulated on the amd64 runner for every other platform.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # An image of its own title and description, for a repository with
    # several images. Without one, the metadata step takes the repository's.
    - name: Title and description of the image
      id: own
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DESCRIPTION: ${{ inputs.description }}
      run: |
        set -euo pipefail
        {
          echo "lines<<END_OF_LINES"
          if [ -n "$DESCRIPTION" ]; then
            echo "org.opencontainers.image.title=$IMAGE"
            echo "org.opencontainers.image.description=$DESCRIPTION"
          fi
          echo "END_OF_LINES"
        } >> "$GITHUB_OUTPUT"

    # Tags from the release tag, and the OCI labels, among them
    # org.opencontainers.image.source, which links the package to the
    # repository. latest stays on the last full release.
    - name: Derive image tags, labels and annotations
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        flavor: latest=false
        tags: |
          type=${{ inputs.version-scheme }},pattern={{version}}
          type=${{ inputs.version-scheme }},pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
        labels: ${{ steps.own.outputs.lines }}
        annotations: ${{ steps.own.outputs.lines }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}

    # Every tag is read, not only the first: each must be the very same
    # index, byte for byte, or one tag would serve another build.
    - name: The published index carries what the package page reads
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        PLATFORMS: ${{ inputs.platforms }}
        INDEX: ${{ runner.temp }}/ghcr-index.json
      run: |
        set -euo pipefail
        ref=$(printf '%s\n' "$TAGS" | head -n 1)
        echo "inspecting ${ref}"
        docker buildx imagetools inspect "$ref" --raw > "$INDEX"
        printf '%s\n' "$TAGS" | while read -r tag; do
          [ -n "$tag" ] || continue
          docker buildx imagetools inspect "$tag" --raw > "$INDEX.other"
          if ! cmp -s "$INDEX" "$INDEX.other"; then
            echo "::error::${tag} is not the same index as ${ref}"
            exit 1
          fi
          echo "same index: ${tag}"
        done
        uv run --no-project "$GITHUB_ACTION_PATH/check_index.py" "$INDEX"
