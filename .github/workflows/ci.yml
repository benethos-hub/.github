name: CI

# Tests for the scripts of the actions in this repository. The repositories of
# the organisation call these actions at main, so a mistake here reaches all of
# them on their next run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Run through uvx, so Dependabot cannot see them. Compare with the newest
  # releases now and then.
  PYTEST_VERSION: 9.1.1
  PYYAML_VERSION: 6.0.3
  MYPY_VERSION: 2.4.0

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Pytest
        run: uvx --with "pyyaml==$PYYAML_VERSION" "pytest==$PYTEST_VERSION" -q tests

      - name: Mypy (strict) on the action scripts
        run: uvx "mypy==$MYPY_VERSION" --strict actions/release/ci-passed/ci_passed.py
