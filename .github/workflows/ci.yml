name: CI

# Tests for the scripts of the actions in this repository. The repositories of
# the organisation call these actions at main, so a mistake here reaches all of
# them on their next run. Ruff, pytest, PyYAML and Mypy come from uv.lock, and
# their settings from pyproject.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install the tools (locked)
        run: uv sync --frozen

      # npm ci refuses a package-lock.json that does not match its
      # package.json, so a dry run is the check.
      - name: Lockfiles are in step with their pyproject.toml or package.json
        run: |
          uv lock --check
          uv lock --check --project actions/python/pip-audit
          npm ci --prefix actions/publish/mcpb --ignore-scripts --no-audit --no-fund --dry-run

      # The same rules python-lint.yml asks of every project.
      - name: Ruff (lint)
        run: uv run --frozen ruff check .

      - name: Ruff (format check)
        run: uv run --frozen ruff format --check .

      - name: Pytest
        run: uv run --frozen pytest -q

      - name: Mypy (strict) on the action scripts
        run: uv run --frozen mypy
