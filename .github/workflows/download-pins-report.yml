name: Download pins report

# Dependabot cannot see a download pinned by version and checksum, such as
# the mcp-publisher of actions/publish/mcp-registry. Every week this checks
# each pin listed in .github/download-pins.yml against the releases of its
# upstream (.github/scripts/download_pins.py). A newer release, or a pinned
# checksum that is not the official one, is reported in a single open issue
# in this repository, with the lines to paste. The issue is closed once every
# pin is current.

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: download-pins-report

jobs:
  report:
    name: Report outdated download pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: download-pins

      - name: Check every pin
        run: uv run --frozen .github/scripts/download_pins.py > "$RUNNER_TEMP/report.md"

      - name: Update the issue
        uses: ./.github/actions/report-issue
        with:
          title: Pinned downloads need an update
          report: ${{ runner.temp }}/report.md
          resolved: Every pinned download is current.
