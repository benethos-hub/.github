name: Download pins report

# Dependabot cannot see a download pinned by version and checksum, such as
# the mcp-publisher of actions/publish/mcp-registry. Every week this checks
# each pin listed in .github/download-pins.yml against the releases of its
# upstream (.github/scripts/download_pins.py). A newer release, or a pinned
# checksum that is not the one in the release's checksums file, is reported
# in a single open issue in this repository, with the lines to paste. The
# issue is closed once every pin is current. The check reads github.com
# without a token, the way the actions download the files, so an IP allow
# list of an upstream organisation cannot refuse it.

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: download-pins-report

jobs:
  report:
    name: Report outdated download pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: download-pins

      - name: Check every pin
        run: uv run --frozen .github/scripts/download_pins.py > "$RUNNER_TEMP/report.md"

      - name: Update the issue
        uses: ./actions/report-issue
        with:
          title: Pinned downloads need an update
          report: ${{ runner.temp }}/report.md
          resolved: Every pinned download is current.
