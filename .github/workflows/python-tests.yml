name: Python tests

# Reusable test run for a Python project managed with uv. The tests run on
# every supported Python version against uv.lock, and the newest version also
# measures the coverage and enforces its floor. With badge: true, that
# version also writes the coverage as a badge for coverage-badge.yml.
# Call it from a repository's CI with:
#
#   test:
#     uses: benethos-hub/.github/.github/workflows/python-tests.yml@main
#     with:
#       sync-args: --extra dev
#       cov: benethos_example
#
# The checks are named after the calling job, test / Python 3.11 and so on.
# Coverage is measured on one version only because it slows the older ones
# down noticeably, and a required check on that version is what makes the
# floor block a merge.

on:
  workflow_call:
    inputs:
      python-versions:
        description: Python versions to test on, as a JSON list.
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python:
        description: The version that measures the coverage, usually the newest.
        type: string
        default: "3.15"
      sync-args:
        description: Extra arguments for uv sync, for example --extra dev.
        type: string
        default: ""
      cov:
        description: Packages to measure, separated by spaces. Empty uses the coverage configuration of the project.
        type: string
        default: ""
      cov-fail-under:
        description: The coverage floor in percent.
        type: number
        default: 80
      timeout-minutes:
        description: Time limit per job.
        type: number
        default: 15
      badge:
        description: Also write the coverage as a badge and upload it as the artifact coverage-badge, for coverage-badge.yml.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
        run: uv sync --frozen $SYNC_ARGS

      - name: Run tests
        if: matrix.python-version != inputs.coverage-python
        run: uv run --frozen pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == inputs.coverage-python
        env:
          COV: ${{ inputs.cov }}
          COV_FAIL_UNDER: ${{ inputs.cov-fail-under }}
        run: |
          cov=(--cov)
          if [ -n "$COV" ]; then
            cov=()
            for package in $COV; do
              cov+=("--cov=$package")
            done
          fi
          uv run --frozen pytest -q "${cov[@]}" "--cov-fail-under=$COV_FAIL_UNDER"

      # The badge takes the coverage the run above measured, from its data
      # file, so pytest runs the same way with and without the badge. Only
      # the percentage goes to the shared action, which is the same for
      # every language.
      - name: Read the measured coverage
        id: coverage
        if: inputs.badge && matrix.python-version == inputs.coverage-python
        run: |
          set -euo pipefail
          uv run --frozen coverage json -o "$RUNNER_TEMP/coverage.json"
          echo "percent=$(jq -r .totals.percent_covered "$RUNNER_TEMP/coverage.json")" >> "$GITHUB_OUTPUT"

      - name: Write the coverage badge
        if: inputs.badge && matrix.python-version == inputs.coverage-python
        uses: benethos-hub/.github/actions/coverage-badge@main
        with:
          percent: ${{ steps.coverage.outputs.percent }}
          badge-json: ${{ runner.temp }}/badge/coverage.json

      - name: Upload it for coverage-badge.yml
        if: inputs.badge && matrix.python-version == inputs.coverage-python
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badge/coverage.json
          retention-days: 7
