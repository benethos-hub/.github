name: Dependency audit

# Reusable check that no package in a repository's uv.lock has a known
# vulnerability. It covers what GitHub's dependency graph cannot read: the
# dependency graph parses no uv.lock, so dependency-review-action sees none of
# the packages that land in an image. Call it from a repository's CI with:
#
#   audit:
#     uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main
#
# Every version pinned in the lockfile is checked: all workspace members, all
# extras and all dependency groups, development tools included, and the pins
# for every platform and Python version, not only those of the runner. The
# repository's own packages are left out, they are not on PyPI. A
# vulnerability without a fix yet can be waived per repository, by its ID,
# until a fixed version exists:
#
#   audit:
#     uses: benethos-hub/.github/.github/workflows/python-dependency-audit.yml@main
#     with:
#       ignore-vulns: GHSA-xxxx-xxxx-xxxx PYSEC-2026-1

on:
  workflow_call:
    inputs:
      ignore-vulns:
        description: Vulnerability IDs to waive, separated by spaces.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Downloaded at run time, so Dependabot cannot see it. Compare with the
      # newest release of pypa/pip-audit now and then.
      PIP_AUDIT_VERSION: 2.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: List the locked versions
        run: |
          if [ ! -s uv.lock ]; then
            echo "::error file=uv.lock::Missing uv.lock, there is nothing to audit."
            exit 1
          fi
          # Markers are dropped, so the pins of every platform and Python
          # version are audited, not only those that apply to this runner.
          # A package locked in two versions (one for older Pythons, say)
          # would be a duplicate requirement, so each further version of a
          # name goes into the next file.
          mkdir "$RUNNER_TEMP/audit"
          uv export --frozen --no-hashes --no-emit-workspace \
              --all-packages --all-extras --all-groups \
            | sed -n 's/^\([A-Za-z0-9._-]*==[^ ;]*\).*/\1/p' \
            | sort -u \
            | awk -F'==' -v dir="$RUNNER_TEMP/audit" \
                '{ n[tolower($1)]++; print > (dir "/part" n[tolower($1)] ".txt") }'
          echo "$(cat "$RUNNER_TEMP"/audit/part*.txt | wc -l) locked versions"

      - name: Audit against PyPI and OSV
        env:
          IGNORE_VULNS: ${{ inputs.ignore-vulns }}
        run: |
          ignore=()
          for id in $IGNORE_VULNS; do
            ignore+=(--ignore-vuln "$id")
          done
          # --no-deps with --disable-pip audits exactly the listed versions
          # instead of resolving them anew. --strict fails when a package
          # cannot be audited at all, so a gap never passes as "no
          # vulnerabilities".
          failed=0
          for service in pypi osv; do
            for part in "$RUNNER_TEMP"/audit/part*.txt; do
              echo "::group::$service, $(basename "$part")"
              uvx "pip-audit==$PIP_AUDIT_VERSION" --strict --no-deps --disable-pip \
                --desc on --vulnerability-service "$service" "${ignore[@]}" \
                -r "$part" || failed=1
              echo "::endgroup::"
            done
          done
          exit "$failed"
