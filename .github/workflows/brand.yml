name: Brand

# Reusable check that every repository of the organisation carries its brand
# assets in assets/brand: the icon as icon.svg, and two PNG files exported from
# it, icon.png (512x512) and social-preview.png (1280x640), neither older than
# the SVG. The rules are in actions/brand/assets, which the weekly brand
# report applies as well. Call it from a repository's CI with:
#
#   brand:
#     uses: benethos-hub/.github/.github/workflows/brand.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  assets:
    name: Brand assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents, so git can tell which of
          # the files changed last.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: assets/brand
          sparse-checkout-cone-mode: false

      - uses: benethos-hub/.github/actions/brand/assets@main
