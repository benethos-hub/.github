name: Brand report

# Checks every public repository of the organisation against the brand rules,
# the same rules the CI check brand.yml applies (actions/brand/assets/
# brand_assets.py), and compares the social preview uploaded in each
# repository's settings with its social-preview.png. Repositories that break a
# rule are listed in a single open issue in this repository. The issue is
# updated on each run and closed once all repositories meet the rules.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: brand-report

jobs:
  report:
    name: Report brand assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ORG: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            actions/brand/assets
            .github/actions/report-issue

      # The script needs the standard library only, so there is nothing to
      # cache, and the sparse checkout has no uv.lock to key a cache on.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check every repository
        run: uv run --no-project --python ">=3.11" actions/brand/assets/brand_assets.py report > "$RUNNER_TEMP/report.md"

      - name: Update the issue
        uses: ./.github/actions/report-issue
        with:
          title: Brand assets need fixing
          report: ${{ runner.temp }}/report.md
          resolved: All repositories meet the brand rules.
