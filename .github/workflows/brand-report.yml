name: Brand report

# Checks every public repository of the organisation against the brand rules:
# an icon at assets/brand/icon.svg and a 512x512 assets/brand/icon.png that is
# not older than the last change to the SVG. Repositories that break a rule are
# listed in a single open issue in this repository. The issue is updated on
# each run and closed once all repositories meet the rules.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: brand-report

jobs:
  report:
    name: Report brand assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ORG: ${{ github.repository_owner }}
      TITLE: Brand assets need fixing
    steps:
      - name: Check repositories and update the issue
        run: |
          set -euo pipefail

          dir=assets/brand
          svg=$dir/icon.svg
          png=$dir/icon.png
          work=$(mktemp -d)

          repos=$(gh api --paginate "orgs/$ORG/repos?type=public&per_page=100" \
            --jq '.[] | select(.archived | not) | select(.fork | not) | select(.name != ".github") | .name' | sort)

          report=""
          for repo in $repos; do
            problems=""
            add() { problems="$problems  - $1"$'\n'; }

            has_svg=0
            if gh api -H "Accept: application/vnd.github.raw" "repos/$ORG/$repo/contents/$svg" > "$work/icon.svg" 2>/dev/null; then
              has_svg=1
              grep -q '<svg' "$work/icon.svg" || add "\`$svg\` is not an SVG file"
            else
              add "\`$svg\` is missing"
            fi

            has_png=0
            if gh api -H "Accept: application/vnd.github.raw" "repos/$ORG/$repo/contents/$png" > "$work/icon.png" 2>/dev/null; then
              has_png=1
              if [ "$(head -c 8 "$work/icon.png" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
                add "\`$png\` is not a PNG file"
              else
                # Width and height are the two 4-byte big-endian numbers at offset 16.
                size=$(od -An -tu1 -j16 -N8 "$work/icon.png" | awk '{ printf "%dx%d", $1*16777216 + $2*65536 + $3*256 + $4, $5*16777216 + $6*65536 + $7*256 + $8 }')
                [ "$size" = "512x512" ] || add "\`$png\` is $size pixels instead of 512x512"
              fi
            else
              add "\`$png\` is missing"
            fi

            # The last commit that changed the PNG must be the same as or later
            # than the last commit that changed the SVG.
            if [ "$has_svg" -eq 1 ] && [ "$has_png" -eq 1 ]; then
              svg_commit=$(gh api "repos/$ORG/$repo/commits?path=$svg&per_page=1" --jq '.[0].sha')
              png_commit=$(gh api "repos/$ORG/$repo/commits?path=$png&per_page=1" --jq '.[0].sha')
              status=$(gh api "repos/$ORG/$repo/compare/$svg_commit...$png_commit" --jq '.status')
              case "$status" in
                identical | ahead) ;;
                *) add "\`$png\` is older than the last change to \`$svg\`" ;;
              esac
            fi

            if [ -n "$problems" ]; then
              report="$report- [$repo](https://github.com/$ORG/$repo)"$'\n'"$problems"
            fi
          done

          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ -z "$report" ]; then
            echo "All repositories meet the brand rules." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All repositories meet the brand rules now."
            fi
            exit 0
          fi

          body="These repositories do not meet the brand rules:"$'\n\n'"$report"$'\n'"Every repository of the organisation needs its icon as \`$svg\` and as a 512x512 \`$png\` exported from it. The PNG must not be older than the last change to the SVG. This issue is updated by the [Brand report]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/brand-report.yml) workflow and closed once all repositories meet the rules."
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
