# Every entry runs daily, which Dependabot takes as Monday to Friday. A
# release is proposed once it is three days old. Dependabot waits that long
# without the cooldown as well. The cooldown only writes it down.
version: 2
updates:
  # The actions the workflows use, each pinned to a commit with its version in
  # a comment beside it. Dependabot reads the comment and raises commit and
  # comment together. The repositories call the reusable workflows and actions
  # here at main, so their own Dependabot never sees these pins. This entry is
  # the only one that keeps them current. Minor and patch updates come as one
  # pull request, a major update comes alone.
  #
  # "/" covers the workflows. Every action under actions/ that uses another
  # action itself needs its folder listed as well.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/brand/assets"
      - "/actions/coverage-badge"
      - "/actions/publish/ghcr"
      - "/actions/publish/mcp-registry"
      - "/actions/publish/mcpb"
      - "/actions/publish/pypi"
      - "/actions/python/pip-audit"
      - "/actions/release/ci-passed"
      - "/actions/release/tag-matches-version"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Python tools, each locked in a uv.lock. "/" holds the test tools of
  # this repository, actions/python/pip-audit the pip-audit that action runs
  # in every repository. Every folder with a uv.lock needs to be listed here.
  # A test in tests/ fails otherwise.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/actions/python/pip-audit"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Node tools, each locked in a package-lock.json. actions/publish/mcpb
  # holds the Claude Desktop bundle packer and everything beneath it. Every
  # folder with a package-lock.json needs to be listed here. A test in
  # tests/ fails otherwise.
  - package-ecosystem: "npm"
    directories:
      - "/actions/publish/mcpb"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
