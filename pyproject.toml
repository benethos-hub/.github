# Tools for the tests of this repository, locked in uv.lock so Dependabot keeps
# them current. Nothing here is a package, and nothing here reaches the other
# repositories of the organisation.

[project]
name = "benethos-hub-github"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["actions/release/ci-passed/ci_passed.py"]
