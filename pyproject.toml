# Tools for the tests of this repository, locked in uv.lock so Dependabot keeps
# them current. Nothing here is a package, and nothing here reaches the other
# repositories of the organisation.

[project]
name = "benethos-hub-github"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = [
    "actions/release/ci-passed/ci_passed.py",
    "actions/release/tag-matches-version/tag_matches_version.py",
    "actions/brand/assets/brand_assets.py",
    "actions/publish/ghcr/check_index.py",
    "actions/publish/mcp-registry/registry_entry.py",
    "actions/publish/mcpb/check_packed.py",
    "actions/publish/pypi/check_dist.py",
    "actions/coverage-badge/badge.py",
    "actions/publish/pypi/on_pypi.py",
    ".github/scripts/download_pins.py",
]

# The rule set of the Python projects of the organisation.
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "W",    # pycodestyle warnings
]

# What python-tests.yml measures: the scripts the actions and workflows run.
[tool.coverage.run]
source = ["actions", ".github/scripts"]
branch = true
